[project]
name = "anode-model"
version = "0.1.0"
description = "Anode corrosion segmentation model and measurement API"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Data augmentation randomness, and long dataset URLs in comments.
"notebooks/*" = ["S311", "E501"]
