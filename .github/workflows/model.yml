name: Model

on:
  pull_request:
    paths:
      - "model/**"
      - "lib/grading/ri-cutoffs.json"
      - ".github/workflows/model.yml"
  push:
    branches: [main]
    paths:
      - "model/**"
      - "lib/grading/ri-cutoffs.json"
      - ".github/workflows/model.yml"

permissions:
  contents: read

jobs:
  model:
    name: Model server and harness tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
